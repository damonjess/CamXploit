plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.spyboy.camxploit'
    compileSdk 35

    defaultConfig {
        applicationId "com.spyboy.camxploit"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0.2"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

python {
    pip {
        install "requests"
        install "beautifulsoup4"
        install "lxml"
        install "onvif-zeep"
        install "shodan"
    }
}

dependencies {
    // Add any Kotlin/Java dependencies if needed later
}